version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - qdrant
    env_file: .env
    networks:
      - enterprise_net

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - redis
      - postgres
      - qdrant
    env_file: .env
    networks:
      - enterprise_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_enterprise
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - enterprise_net

  redis:
    image: redis:7-alpine
    container_name: redis_enterprise
    ports:
      - "6379:6379"
    networks:
      - enterprise_net

  postgres:
    image: postgres:15-alpine
    container_name: postgres_enterprise
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword2026
      POSTGRES_DB: enterprise_state
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise_net

volumes:
  qdrant_data:
  postgres_data:

networks:
  enterprise_net:
    driver: bridge