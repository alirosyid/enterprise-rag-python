services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - enterprise_net

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - enterprise_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_enterprise
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

  redis:
    image: redis:7-alpine
    container_name: redis_enterprise
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - enterprise_net

  postgres:
    image: postgres:15-alpine
    container_name: postgres_enterprise
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword2026
      POSTGRES_DB: enterprise_state
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d enterprise_state"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

volumes:
  qdrant_data:
  postgres_data:

networks:
  enterprise_net:
    driver: bridge