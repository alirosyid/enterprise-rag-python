name: Enterprise RAG CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Mempercepat build dengan caching
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Kita hanya menginstal dependensi dasar untuk linting saat ini
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Menghentikan build jika ada syntax error atau undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warning sebagai indikator saja, tidak membatalkan build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics